name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Debug APK
        working-directory: android
        run: gradle --stop || true; gradle clean assembleDebug --no-build-cache --rerun-tasks
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyDoc-debug
          path: android/app/build/outputs/apk/debug/*.apk
