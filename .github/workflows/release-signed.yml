name: Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build signed MyDoc release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0"
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Advocate signing keystore
        env:
          MYADV_KEYSTORE_BASE64: ${{ secrets.MYADV_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$MYADV_KEYSTORE_BASE64" || { echo "Missing GitHub secret: MYADV_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$MYADV_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/myadv-release.jks"
          test -s "$GITHUB_WORKSPACE/myadv-release.jks"

      - name: Verify Advocate signing identity
        env:
          KEYSTORE: ${{ github.workspace }}/myadv-release.jks
          STORE_PASSWORD: ${{ secrets.MYADV_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYADV_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MYADV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD" || { echo "Missing GitHub secret: MYADV_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing GitHub secret: MYADV_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing GitHub secret: MYADV_KEY_PASSWORD"; exit 1; }
          keytool -list -keystore "$KEYSTORE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        working-directory: android
        env:
          MYADV_KEYSTORE_FILE: ${{ github.workspace }}/myadv-release.jks
          MYADV_STORE_PASSWORD: ${{ secrets.MYADV_STORE_PASSWORD }}
          MYADV_KEY_ALIAS: ${{ secrets.MYADV_KEY_ALIAS }}
          MYADV_KEY_PASSWORD: ${{ secrets.MYADV_KEY_PASSWORD }}
        run: gradle clean assembleRelease --no-build-cache --rerun-tasks

      - name: Verify APK is actually signed
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          apksigner verify --verbose --print-certs "$APK"

      - name: Rename final APK
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" android/app/build/outputs/apk/release/MyDoc-release-signed.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: MyDoc-release-signed
          path: android/app/build/outputs/apk/release/MyDoc-release-signed.apk
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        run: rm -f myadv-release.jks
